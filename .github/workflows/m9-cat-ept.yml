name: M9 CAT-EPT models

on:
  pull_request:
    branches: [main]
    paths:
      - "openwave/xperiments/m9_cat_ept/**"
      - "tests/test_m9_*"
      - ".github/workflows/m9-cat-ept.yml"
  push:
    branches: [main]
    paths:
      - "openwave/xperiments/m9_cat_ept/**"
      - "tests/test_m9_*"
      - ".github/workflows/m9-cat-ept.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m9-cat-ept-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-model-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install focused test dependencies
        run: python -m pip install --upgrade pip pytest "numpy>=2.3,<3.0"

      - name: Compile coupled model modules
        run: |
          python -m py_compile \
            openwave/xperiments/m9_cat_ept/coupled_cat_ept_evolution_m132.py \
            openwave/xperiments/m9_cat_ept/coupled_cat_ept_campaign_m132.py \
            openwave/xperiments/m9_cat_ept/m132_coupled_cat_ept_authority.py \
            openwave/xperiments/m9_cat_ept/gauge_coupled_cat_ept_m133.py \
            openwave/xperiments/m9_cat_ept/gauge_exchange_refinement_m133.py \
            openwave/xperiments/m9_cat_ept/m133_gauge_coupled_authority.py

      - name: Run M9.132 and M9.133 model tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest -q \
            tests/test_m9_coupled_cat_ept_evolution_m132.py \
            tests/test_m9_coupled_cat_ept_campaign_m132.py \
            tests/test_m9_gauge_coupled_cat_ept_m133.py
