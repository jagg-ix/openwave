name: M9 CAT-EPT models

on:
  pull_request:
    branches: [main]
    paths:
      - "openwave/xperiments/m9_cat_ept/**"
      - "tests/test_m9_*"
      - ".github/workflows/m9-cat-ept.yml"
  push:
    branches: [main]
    paths:
      - "openwave/xperiments/m9_cat_ept/**"
      - "tests/test_m9_*"
      - ".github/workflows/m9-cat-ept.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m9-cat-ept-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  complete-cat-ept-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install OpenWave and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Inventory CAT/EPT tests
        run: |
          find tests -maxdepth 1 -type f -name 'test_m9_*.py' -print | sort | tee /tmp/m9-tests.txt
          test -s /tmp/m9-tests.txt
          echo "M9 test files: $(wc -l < /tmp/m9-tests.txt)"

      - name: Compile CAT/EPT Python modules
        run: |
          find openwave/xperiments/m9_cat_ept -type f -name '*.py' -print0 \
            | sort -z \
            | xargs -0 python -m py_compile

      - name: Run complete CAT/EPT test suite
        env:
          PYTHONPATH: ${{ github.workspace }}
          MPLBACKEND: Agg
        run: |
          python -m pytest \
            --continue-on-collection-errors \
            -ra --durations=30 \
            tests/test_m9_*.py
